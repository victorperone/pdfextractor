[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-pdf-text"
version = "0.1.0"
description = "Local, auditable structured PDF text extraction with native evidence first."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "structured-pdf-text maintainers"}]
dependencies = [
    "pypdfium2>=5.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "numpy==2.0.2",
]
ocr = [
    "paddlepaddle>=3.3",
    "paddleocr>=3.7",
    "paddlex[ocr]>=3.7",
    "psutil>=5.9",
]
# RapidOCR family with selectable inference provider.
ocr-rapidocr-onnx = [
    "rapidocr>=3.9.2",
    "onnxruntime>=1.18",
]
ocr-rapidocr-openvino = [
    "rapidocr>=3.9.2",
    "openvino>=2024.4",
]
# Fase 6: Tesseract (executável externo obrigatório: tesseract 5.x + por.traineddata)
# Sem dependência Python adicional (usa subprocess)
# Fase 7: EasyOCR (PyTorch CPU)
# Instalar: pip install "structured-pdf-text[ocr-easyocr]"
ocr-easyocr = [
    "easyocr>=1.7",
]
[project.scripts]
pdftext = "structured_pdf_text.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
